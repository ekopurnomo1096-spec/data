<!DOCTYPE html>
<html lang="id">
<head>

<title>Cari prospek hair extension</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#12263f;--mute:#586a80;--line:#d3deea;--acc:#1f6feb;--accsoft:#e1ecfb;--ok:#17803d;--err:#b42318;--errbg:#fdecea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1826;--card:#16243a;--ink:#e6eef8;--mute:#9bacc0;--line:#27394f;--acc:#6aa5ff;--accsoft:#1f3556;--ok:#5fd08a;--err:#ff9a8f;--errbg:#3a1f22}}
:root[data-theme="dark"]{--bg:#0e1826;--card:#16243a;--ink:#e6eef8;--mute:#9bacc0;--line:#27394f;--acc:#6aa5ff;--accsoft:#1f3556;--ok:#5fd08a;--err:#ff9a8f;--errbg:#3a1f22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:30px 18px 70px}
h1{font-size:clamp(1.4rem,3.6vw,1.9rem);line-height:1.2;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px;max-width:60ch;font-size:.92rem}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-size:.88rem;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
:is(button,input,select,a):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.form{display:grid;grid-template-columns:1fr 1.2fr 1.2fr auto;gap:12px;align-items:end}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin-bottom:12px}
@media (max-width:640px){.form2{grid-template-columns:1fr}}
.hint{color:var(--mute);font-size:.78rem;margin:-2px 0 16px}
.combo{position:relative}
.combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:230px;overflow:auto;z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:4px}
.combo-list div{padding:9px 12px;border-radius:7px;cursor:pointer;font-size:.88rem}
.combo-list div.hi,.combo-list div:hover{background:var(--accsoft)}
.combo-list .none{color:var(--mute);cursor:default}
.combo-list .none:hover{background:transparent}
.f label{display:block;font-weight:700;font-size:.8rem;margin-bottom:5px}
input[type=text],select{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;height:44px}
.go{height:44px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:0 22px;font:inherit;font-size:.92rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.go[disabled]{opacity:.7;cursor:progress}
.status{margin-top:20px}
.load{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--accsoft);border-radius:12px;font-weight:500}
.spin{flex:none;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
.go .spin{width:18px;height:18px;border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{height:92px;border-radius:12px;margin-top:10px;background:linear-gradient(90deg,var(--line) 25%,var(--accsoft) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.3s ease-in-out infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{background:var(--errbg);color:var(--err);border-radius:12px;padding:14px 16px;font-weight:500}
.info{color:var(--mute);padding:6px 2px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin:2px 0 6px}
.bar b{font-size:.92rem;font-weight:700}
.chk{display:flex;gap:7px;align-items:center;font-size:.86rem;cursor:pointer}
.chk input{width:16px;height:16px}
.ghost{background:transparent;color:var(--acc);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font:inherit;font-size:.86rem;font-weight:500;cursor:pointer}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;background:var(--card)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.rate{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rate b{font-weight:700;font-size:.82rem}
.rate small{font-weight:400;color:var(--mute);font-size:.72rem}
.stars{position:relative;display:inline-block;font-size:12px;line-height:1;letter-spacing:1px}
.stars i{font-style:normal;color:var(--line)}
.stars em{position:absolute;top:0;left:0;overflow:hidden;white-space:nowrap;font-style:normal;color:#f2b600}
.addr{margin:0;color:var(--mute);font-size:.82rem;line-height:1.4;min-height:2.3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rows{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.r2{display:flex;align-items:center;gap:8px;min-width:0;height:20px}
.r2 svg{flex:none;color:var(--acc)}
.r2 a,.r2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r2 a{color:var(--ink);text-decoration:none;font-weight:500}
.r2 a:hover{color:var(--acc);text-decoration:underline}
.r2.off{color:var(--mute)}
.r2.off svg{color:var(--mute);opacity:.55}
.mapl{margin-top:auto;padding-top:2px;display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:700;font-size:.82rem;text-decoration:none}
.mapl:hover{text-decoration:underline}
.tag{align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--ok)}
.seg{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:10px}
.seg b{display:block}
.seg span{color:var(--mute);font-size:.95rem}
.note{margin-top:26px;font-size:.8rem;color:var(--mute);border-left:3px solid var(--acc);padding-left:12px;max-width:72ch}
@media (prefers-reduced-motion:reduce){.spin,.sk{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Temukan pembeli hair extension di kota mana pun</h1>
<p class="sub">Cari salon dan toko wig asli lengkap dengan alamat dan kontaknya, di Indonesia maupun luar negeri.</p>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t1" aria-selected="true">Cari tempat</button>
  <button class="tab" role="tab" id="t2" aria-selected="false">Siapa yang membeli?</button>
</div>

<section class="panel" id="p1">
  <div class="form2">
    <div class="f combo"><label for="country">Negara</label>
      <input type="text" id="country" autocomplete="off" placeholder="Ketik untuk cari negara…">
      <div class="combo-list" id="countryList" hidden></div></div>
    <div class="f combo"><label for="citysel">Cari kota</label>
      <input type="text" id="citysel" autocomplete="off" placeholder="Pilih negara dulu untuk lihat kota populer, atau ketik di sini">
      <div class="combo-list" id="cityselList" hidden></div></div>
  </div>
  <div class="form">
    <div class="f"><label for="kind">Jenis tempat</label>
      <select id="kind"><option value="salon">Salon rambut</option><option value="wig">Toko wig / beauty supply</option><option value="beauty">Toko kecantikan</option></select></div>
    <div class="f"><label for="source">Sumber data</label>
      <select id="source"><option value="google">Google Maps (lengkap)</option><option value="osm">OpenStreetMap (gratis, tipis)</option></select></div>
    <div class="f"><label for="city">Kota</label><input type="text" id="city" value="London" placeholder="Contoh: London, Houston USA, Purwokerto"></div>
    <button class="go" id="run"><span id="runtxt">Cari</span></button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div id="res" hidden>
    <div class="bar"><b id="count"></b>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <label class="chk"><input type="checkbox" id="onlyc"> Hanya yang punya kontak</label>
        <label class="chk"><input type="checkbox" id="onlye"> Hanya yang punya email</label>
        <button class="ghost" id="copy">Salin sebagai CSV</button><span id="copied" class="info" hidden></span>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>
</section>

<section class="panel" id="p2" hidden>
  <p class="info" style="margin-top:0">Daftar pembeli yang paling mungkin tertarik. Yang punya tombol bisa langsung dicari di peta.</p>
  <div id="segs"></div>
</section>

</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ic(p){return"<svg viewBox='0 0 24 24' width='19' height='19' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>"+p+"</svg>"}
var IC={tel:ic("<path d='M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z'/>"),
mail:ic("<rect width='20' height='16' x='2' y='4' rx='2'/><path d='m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'/>"),
web:ic("<circle cx='12' cy='12' r='10'/><path d='M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20'/><path d='M2 12h20'/>"),
pin:ic("<path d='M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z'/><circle cx='12' cy='10' r='3'/>")};
function stars(rating){
  var pct=Math.max(0,Math.min(100,(parseFloat(rating)||0)/5*100));
  return"<span class='stars'><i>&#9733;&#9733;&#9733;&#9733;&#9733;</i><em style='width:"+pct.toFixed(0)+"%'>&#9733;&#9733;&#9733;&#9733;&#9733;</em></span>";
}
function row(icon,val,link,empty){return val?"<div class='r2'>"+icon+"<a href='"+link+"'"+(link.indexOf("http")===0?" target='_blank' rel='noopener'":"")+">"+esc(val)+"</a></div>":"<div class='r2 off'>"+icon+"<span>"+empty+"</span></div>"}
var LABEL={salon:"salon",wig:"toko wig",beauty:"toko kecantikan"};
var COUNTRY_CODES={"Indonesia":"ID","Malaysia":"MY","Singapore":"SG","Thailand":"TH","Vietnam":"VN","Philippines":"PH","India":"IN","China":"CN","Hong Kong":"HK","Taiwan":"TW","Japan":"JP","South Korea":"KR","Pakistan":"PK","Bangladesh":"BD","Sri Lanka":"LK","Nepal":"NP","United States":"US","Canada":"CA","Mexico":"MX","Brazil":"BR","Argentina":"AR","Chile":"CL","Colombia":"CO","Peru":"PE","United Kingdom":"GB","Ireland":"IE","France":"FR","Germany":"DE","Netherlands":"NL","Belgium":"BE","Spain":"ES","Portugal":"PT","Italy":"IT","Switzerland":"CH","Austria":"AT","Sweden":"SE","Norway":"NO","Denmark":"DK","Finland":"FI","Poland":"PL","Czech Republic":"CZ","Greece":"GR","Turkey":"TR","Russia":"RU","Ukraine":"UA","United Arab Emirates":"AE","Saudi Arabia":"SA","Qatar":"QA","Egypt":"EG","South Africa":"ZA","Nigeria":"NG","Kenya":"KE","Morocco":"MA","Australia":"AU","New Zealand":"NZ"};
var COUNTRY_NAMES=Object.keys(COUNTRY_CODES).sort(function(a,b){return a.localeCompare(b)});
function combo(inputId,listId,opts){
  var inp=$(inputId),list=$(listId),items=[],hi=-1,cur="";
  function filtered(){
    var q=inp.value.trim().toLowerCase();
    return q?items.filter(function(x){return x.toLowerCase().indexOf(q)>-1}):items;
  }
  function draw(){
    var f=filtered();
    hi=-1;
    list.innerHTML=f.length?f.map(function(x){return"<div data-v='"+esc(x)+"'>"+esc(x)+"</div>"}).join(""):"<div class='none'>Tidak ada yang cocok</div>";
    list.hidden=false;
  }
  function pick(v){
    inp.value=v;cur=v;list.hidden=true;
    if(opts.onPick)opts.onPick(v);
  }
  list.addEventListener("mousedown",function(e){
    var d=e.target.closest("div[data-v]");
    if(d)pick(d.getAttribute("data-v"));
  });
  inp.addEventListener("input",function(){cur="";draw()});
  inp.addEventListener("focus",function(){if(!inp.disabled)draw()});
  inp.addEventListener("blur",function(){setTimeout(function(){list.hidden=true;if(!cur)inp.value=""},120)});
  inp.addEventListener("keydown",function(e){
    if(list.hidden&&(e.key==="ArrowDown"||e.key==="ArrowUp")){draw();return}
    var f=list.querySelectorAll("div[data-v]");
    if(e.key==="ArrowDown"){e.preventDefault();hi=Math.min(hi+1,f.length-1)}
    else if(e.key==="ArrowUp"){e.preventDefault();hi=Math.max(hi-1,0)}
    else if(e.key==="Enter"){if(hi>-1&&f[hi]){e.preventDefault();pick(f[hi].getAttribute("data-v"))}return}
    else if(e.key==="Escape"){list.hidden=true;return}
    else return;
    f.forEach(function(d,i){d.classList.toggle("hi",i===hi)});
    if(f[hi])f[hi].scrollIntoView({block:"nearest"});
  });
  return{setItems:function(a){items=a},clear:function(){inp.value="";cur=""}};
}
var POPULAR_CITIES={
"Indonesia":["Jakarta","Surabaya","Bandung","Medan","Semarang","Makassar","Palembang","Denpasar","Yogyakarta","Purwokerto"],
"Malaysia":["Kuala Lumpur","George Town","Johor Bahru","Ipoh","Kota Kinabalu"],
"Singapore":["Singapore"],
"Thailand":["Bangkok","Chiang Mai","Phuket","Pattaya"],

"Austria":["Vienna"],
"Sweden":["Stockholm","Gothenburg"],
"Norway":["Oslo"],
"Denmark":["Copenhagen"],
"Finland":["Helsinki"],
"Poland":["Warsaw","Krakow"],
"Czech Republic":["Prague"],
"Greece":["Athens"],
"Turkey":["Istanbul","Ankara"],
"Russia":["Moscow","Saint Petersburg"],
"Ukraine":["Kyiv"],
"United Arab Emirates":["Dubai","Abu Dhabi","Sharjah"],
"Saudi Arabia":["Riyadh","Jeddah"],
"Qatar":["Doha"],
"Egypt":["Cairo","Alexandria"],
"South Africa":["Johannesburg","Cape Town","Durban"],
"Nigeria":["Lagos","Abuja"],
"Kenya":["Nairobi"],
"Morocco":["Casablanca","Marrakesh"],
"Australia":["Sydney","Melbourne","Brisbane","Perth"],
"New Zealand":["Auckland","Wellington"]
};
function comboAsync(inputId,listId,opts){
  var inp=$(inputId),list=$(listId),hi=-1,cur="",t=null,seq=0;
  function show(html){list.innerHTML=html;list.hidden=false}
  function render(results,cname){
    hi=-1;
    if(!results.length){show("<div class='none'>Tidak ditemukan"+(cname?" di "+esc(cname):"")+"</div>");return}
    show(results.map(function(r,i){return"<div data-i='"+i+"'>"+esc(r.label)+"</div>"}).join(""));
    list._data=results;
  }
  function search(q){
    var mySeq=++seq;
    show("<div class='none'>Mencari…</div>");
    opts.fetch(q,function(results,cname){if(mySeq===seq)render(results,cname)},function(){if(mySeq===seq)show("<div class='none'>Gagal mencari (cek koneksi), coba lagi</div>")});
  }
  function pick(r){inp.value=r.label;cur=r.label;list.hidden=true;if(opts.onPick)opts.onPick(r)}
  function showDefault(){
    var d=opts.popular&&opts.popular();
    if(d&&d.items.length){
      list.innerHTML="<div class='none' style='padding:7px 12px 3px'>"+esc(d.title)+"</div>"+d.items.map(function(r,i){return"<div data-i='"+i+"'>"+esc(r.label)+"</div>"}).join("");
      list._data=d.items;list.hidden=false;hi=-1;
    }else list.hidden=true;
  }
  list.addEventListener("mousedown",function(e){
    var d=e.target.closest("div[data-i]");
    if(d&&list._data)pick(list._data[+d.getAttribute("data-i")]);
  });
  inp.addEventListener("input",function(){
    cur="";clearTimeout(t);
    var q=inp.value.trim();
    if(q.length<2){showDefault();return}
    t=setTimeout(function(){search(q)},350);
  });
  inp.addEventListener("focus",function(){
    var q=inp.value.trim();
    if(q.length>=2&&list.innerHTML)list.hidden=false;
    else if(q.length<2)showDefault();
  });
  inp.addEventListener("blur",function(){setTimeout(function(){list.hidden=true;if(!cur)inp.value=""},150)});
  inp.addEventListener("keydown",function(e){
    var f=list.querySelectorAll("div[data-i]");
    if(e.key==="ArrowDown"){e.preventDefault();hi=Math.min(hi+1,f.length-1)}
    else if(e.key==="ArrowUp"){e.preventDefault();hi=Math.max(hi-1,0)}
    else if(e.key==="Enter"){if(hi>-1&&list._data&&list._data[hi]){e.preventDefault();pick(list._data[hi])}return}
    else if(e.key==="Escape"){list.hidden=true;return}
    else return;
    f.forEach(function(d,i){d.classList.toggle("hi",i===hi)});
    if(f[hi])f[hi].scrollIntoView({block:"nearest"});
  });
  return{refresh:function(){var q=inp.value.trim();if(q.length>=2)search(q);else if(document.activeElement===inp)showDefault()},showDefault:showDefault};
}
(function initPicker(){
  var cityAsync;
  var countryCombo=combo("country","countryList",{onPick:function(){
    if(!cityAsync)return;
    $("citysel").focus();
    cityAsync.showDefault();
  }});
  countryCombo.setItems(COUNTRY_NAMES);
  $("country").addEventListener("input",function(){if(cityAsync)cityAsync.refresh()});
  cityAsync=comboAsync("citysel","cityselList",{
    popular:function(){
      var cname=$("country").value.trim();
      var cities=POPULAR_CITIES[cname];
      if(!cname||!cities)return null;
      return{title:"Kota populer di "+cname,items:cities.map(function(k){return{label:k+", "+cname,name:k,country:cname}})};
    },
    fetch:function(q,ok,fail){
      var cname=$("country").value.trim(),code=COUNTRY_CODES[cname];
      var url="https://geocoding-api.open-meteo.com/v1/search?count=100&language=id&format=json&name="+encodeURIComponent(q);
      fetch(url).then(function(r){return r.json()}).then(function(j){
        var list=j.results||[];
        if(code)list=list.filter(function(x){return(x.country_code||"").toUpperCase()===code});
        ok(list.slice(0,10).map(function(x){
          var bits=[x.name,x.admin1,x.country].filter(Boolean);
          return{label:bits.join(", "),name:x.name,country:x.country||""};
        }),code?cname:"");
      }).catch(fail);
    },
    onPick:function(r){$("city").value=r.label;$("city").focus()}
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest(".combo")){$("countryList").hidden=true;$("cityselList").hidden=true}
  });
})();
var rows=[],timer=null;
var STEPS=["Mencari lokasi kota…","Mengambil data tempat…","Hampir selesai. Kota besar butuh waktu lebih lama…"];
function loading(on){
  $("run").disabled=on;
  $("runtxt").textContent=on?"Mencari…":"Cari";
  if(on){
    $("res").hidden=true;
    var i=0;
    $("status").innerHTML="<div class='load'><div class='spin'></div><span id='lm'>"+STEPS[0]+"</span></div><div class='sk'></div><div class='sk'></div><div class='sk'></div>";
    timer=setInterval(function(){i=Math.min(i+1,STEPS.length-1);var m=$("lm");if(m)m.textContent=STEPS[i]},4000);
  }else{clearInterval(timer);$("status").innerHTML=""}
}
function say(cls,t){$("status").innerHTML="<div class='"+cls+"'>"+t+"</div>"}
function href(u){return/^https?:\/\//i.test(u)?u:"https://"+u}
function render(){
  var only=$("onlyc").checked,onlye=$("onlye").checked;
  var r=rows.filter(function(x){return(!only||x.phone||x.website||x.email)&&(!onlye||x.email)});
  var withc=rows.filter(function(x){return x.phone||x.website||x.email}).length;
  var withe=rows.filter(function(x){return x.email}).length;
  $("count").textContent=rows.length+" tempat ditemukan, "+withc+" punya kontak, "+withe+" punya email";
  $("copied").hidden=true;
  $("list").innerHTML=r.length?r.map(function(x){
    var ph=x.phone?x.phone.split(/[;,]/)[0].trim():"";
    var site=x.website?href(x.website):"";
    var rate=x.rating?"<span class='rate'>"+stars(x.rating)+"<b>"+esc(x.rating)+"</b>"+(x.reviews?"<small>"+esc(x.reviews)+" ulasan</small>":"")+"</span>":"";
    var addr=x.address||"";
    return"<div class='item'><div class='top'><h3>"+esc(x.name)+"</h3>"+rate+"</div><p class='addr' title='"+esc(addr)+"'>"+(addr?esc(addr):"Alamat belum diisi")+"</p><div class='rows'>"
      +row(IC.tel,ph,"tel:"+esc(ph.replace(/[^\d+]/g,"")),"Belum ada nomor telepon")
      +row(IC.mail,x.email,"mailto:"+esc(x.email||""),"Belum ada email")
      +row(IC.web,site.replace(/^https?:\/\/(www\.)?/i,"").replace(/\/$/,""),esc(site),"Belum ada website")
      +"</div>"+(x.osm?"<a class='mapl' href='"+esc(x.osm)+"' target='_blank' rel='noopener'>"+IC.pin+"Lihat di peta</a>":"")+"</div>"
  }).join(""):"<p class='info'>Tidak ada tempat yang punya kontak. Matikan filter untuk melihat semuanya.</p>";
  $("res").hidden=false;
}
async function run(){
  var city=$("city").value.trim(),kind=$("kind").value;
  if(!city){say("err","Tulis nama kota dulu, misalnya London atau Purwokerto.");$("city").focus();return}
  loading(true);
  try{
    var r=await fetch("/api/places?city="+encodeURIComponent(city)+"&kind="+kind+"&source="+$("source").value),tx=await r.text(),j;
    try{j=JSON.parse(tx)}catch(x){throw new Error("server membalas error ("+r.status+"). Cek Logs di dashboard Vercel.")}
    if(!r.ok)throw new Error(j.error||"Gagal");
    rows=j.results;loading(false);
    if(!rows.length)return say("info","Tidak ada "+LABEL[kind]+" di "+esc(city)+" pada data OpenStreetMap. Coba kota lain atau jenis tempat lain.");
    render();
  }catch(e){loading(false);say("err","Pencarian gagal: "+esc(e.message.replace(/\.$/,""))+". Server peta gratis kadang sibuk, jadi coba lagi beberapa saat.")}
}
$("run").onclick=run;$("onlyc").onchange=render;$("onlye").onchange=render;
$("city").addEventListener("keydown",function(e){if(e.key==="Enter")run()});
$("copy").onclick=function(){
  var only=$("onlyc").checked,onlye=$("onlye").checked;
  var r=rows.filter(function(x){return(!only||x.phone||x.website||x.email)&&(!onlye||x.email)});
  var csv="nama,alamat,telepon,website,email\n"+r.map(function(x){return[x.name,x.address,x.phone,x.website,x.email].map(function(v){return'"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  function done(t){$("copied").textContent=t;$("copied").hidden=false}
  try{navigator.clipboard.writeText(csv).then(function(){done("Tersalin.")},function(){done("Gagal menyalin.")})}catch(e){done("Gagal menyalin.")}
};
var SEG=[["Salon yang memasang hair extension","Memakai extension setiap hari dan butuh pasokan stabil.","salon"],["Toko wig dan beauty supply","Membeli rutin untuk dijual lagi.","wig"],["Toko kecantikan","Cocok untuk titip jual extension clip-in.","beauty"],["Importir dan distributor di luar negeri","Volume besar. Cari lewat direktori B2B seperti Alibaba atau Global Sources.",""],["Perias pengantin","Cari lewat Instagram dengan kata kunci “bridal hair” plus nama kota.",""],["Pabrik wig dan rambut","Calon mitra atau pesaing. Cari lewat direktori ekspor.",""]];
function tab(n){[1,2].forEach(function(i){$("p"+i).hidden=n!==i;$("t"+i).setAttribute("aria-selected",n===i)})}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
$("segs").innerHTML=SEG.map(function(s,i){return"<div class='seg'><b>"+s[0]+"</b><span>"+s[1]+"</span>"+(s[2]?"<div style='margin-top:8px'><button class='ghost' data-i='"+i+"'>Cari di peta</button></div>":"")+"</div>"}).join("");
document.querySelectorAll("#segs button").forEach(function(b){b.onclick=function(){$("kind").value=SEG[+b.getAttribute("data-i")][2];tab(1);$("city").focus()}});
})();
</script>
</body>
</html>
